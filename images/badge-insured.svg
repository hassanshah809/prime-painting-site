<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Licensed and fully insured">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8e596"/>
      <stop offset="0.5" stop-color="#c9982e"/>
      <stop offset="1" stop-color="#f3d878"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#111"/>
    </linearGradient>
  </defs>

  <!-- banner tails, behind the shield -->
  <polygon points="2,186 44,186 44,234 2,234 15,210" fill="#14592f"/>
  <polygon points="298,186 256,186 256,234 298,234 285,210" fill="#14592f"/>

  <!-- shield -->
  <path d="M150 10 L264 47 V140 C264 213 215 263 150 292 C85 263 36 213 36 140 V47 Z" fill="url(#gold)"/>
  <path d="M150 27 L248 59 V140 C248 202 206 246 150 273 C94 246 52 202 52 140 V59 Z" fill="url(#dark)"/>

  <text x="150" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700"
        font-size="19" letter-spacing="4" fill="#f3d878">LICENSED</text>

  <!-- check mark -->
  <circle cx="150" cy="128" r="31" fill="#208d4e" stroke="#f3d878" stroke-width="3"/>
  <path d="M134 129 L146 141 L167 116" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- banner -->
  <rect x="16" y="174" width="268" height="50" fill="#208d4e"/>
  <text x="150" y="210" text-anchor="middle" font-family="Impact, 'Arial Black', Arial, sans-serif"
        font-size="31" fill="#fff" textLength="222" lengthAdjust="spacingAndGlyphs">FULLY INSURED</text>

  <text x="150" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="16" letter-spacing="4" fill="#f3d878">★ ★ ★</text>
</svg>
