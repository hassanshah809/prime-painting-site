<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Satisfaction guaranteed 100%">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8e596"/>
      <stop offset="0.5" stop-color="#c9982e"/>
      <stop offset="1" stop-color="#f3d878"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27a35b"/>
      <stop offset="1" stop-color="#17693a"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf0"/>
      <stop offset="1" stop-color="#f6e6a8"/>
    </linearGradient>
    <path id="top" d="M 54,150 A 96 96 0 0 1 246,150"/>
    <path id="bottom" d="M 36,150 A 114 114 0 0 0 264,150"/>
  </defs>

  <circle cx="150" cy="150" r="146" fill="url(#gold)"/>
  <circle cx="150" cy="150" r="134" fill="url(#green)"/>
  <circle cx="150" cy="150" r="80" fill="url(#face)" stroke="url(#gold)" stroke-width="6"/>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="22" letter-spacing="3"
     fill="#fff" text-anchor="middle">
    <text><textPath href="#top" startOffset="50%">SATISFACTION</textPath></text>
    <text><textPath href="#bottom" startOffset="50%">GUARANTEED</textPath></text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#f3d878" text-anchor="middle">
    <text x="43" y="157">★</text>
    <text x="257" y="157">★</text>
  </g>

  <text x="150" y="173" text-anchor="middle" font-family="Impact, 'Arial Black', Arial, sans-serif"
        font-size="64" fill="#1d1d1d" textLength="128" lengthAdjust="spacingAndGlyphs">100%</text>
</svg>
